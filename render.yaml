services:
  - type: web
    name: r1ver-api
    runtime: rust
    plan: free
    region: ohio # same region as the Supabase project, to keep query latency low
    buildCommand: cargo build --release --features "analyze demo shortdeck"
    startCommand: ./target/release/r1ver
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      # DB_URL holds the Supabase connection string and is set in the dashboard,
      # not here — sync:false keeps it out of the repo.
      - key: DB_URL
        sync: false
